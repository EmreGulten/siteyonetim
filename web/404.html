<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı — Site Yönetimi</title>
  <link rel="icon" href="assets/img/logo.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand"><img src="assets/img/logo.png" alt="Site Yönetimi"> <span>Site Yönetimi</span></a>
      <nav class="nav" id="nav">
        <a href="features.html" data-i18n="nav.features">Özellikler</a>
        <a href="premium.html" data-i18n="nav.premium">Premium</a>
        <a href="support.html" data-i18n="nav.support">Destek</a>
        <a href="#" class="nav-cta" data-i18n="nav.getapp">Uygulamayı İndir</a>
      </nav>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="tr">TR</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="menu-toggle" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
      </div>
    </div>
  </header>

  <div class="container center-box">
    <h1 data-i18n="notfound.title">404</h1>
    <p data-i18n="notfound.text">Aradığınız sayfa bulunamadı.</p>
    <a href="/" class="btn btn-fill" style="display:inline-flex;" data-i18n="notfound.btn">Ana Sayfaya Dön</a>
  </div>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/i18n.js"></script>
</body>
</html>
