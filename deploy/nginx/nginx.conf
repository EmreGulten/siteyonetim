# ============================================================
#  Nginx — Reverse Proxy (FAZ 1)
#  SSL/Let's Encrypt, gzip, güvenlik header'ları, rate limit
# ============================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;            # Nginx sürümünü gizle
    client_max_body_size 25m;       # Makbuz/fatura görseli yüklemeleri için

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # ---- Rate Limiting (FAZ 6 ile bağlantılı) ----
    # IP başına saniyede 10 istek / dakikada ~60 burst kabulu
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ---- Upstream: .NET API ----
    upstream api_upstream {
        server api:8080;
        keepalive 32;
    }

    # ---- Upstream: MinIO (storage proxy) ----
    upstream minio_upstream {
        server minio:9000;
        keepalive 16;
    }

    # SSL ayarları (conf.d'deki server bloklarına include edilir)
    include /etc/nginx/conf.d/*.conf;
}
